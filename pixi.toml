# Written by Ecoscope Studio: the project that compiles spec.yaml (dev/recompile.sh).
[workspace]
name = "subject-nsd-plot"
channels = ["https://repo.prefix.dev/ecoscope-workflows/", "https://repo.prefix.dev/ecoscope-workflows-custom/", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
wt-compiler = ">=0.8.2, <0.9"
graphviz = "*"
go-yq = "*"
# wt-compiler runs `python -m ruff`: ruff 0.17 (conda-forge) has no Python module
ruff = "<0.17"
# with Python 3.15 it can't write VERSION.yaml (ruamel.yaml's C emitter)
python = "<3.15"
