# Written by Ecoscope Studio from the design “subject-nsd-plot”. Edit it in Studio's designer;
# changes made here are replaced the next time the design is saved.
id: subject_nsd_plot
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-mep
  version: ==1.0.8
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-ste
  version: ==0.0.0rc1
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: ecoscope-workflows-ext-custom
  version: ==0.1.0rc14
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: ==0.9.2
  channel: conda-forge
task-instance-defaults:
  skipif:
    conditions:
    - never
workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'
- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection
- name: Set Groupers
  id: groupers
  task: set_groupers
  partial:
    groupers:
    - index_name: extra__name
- name: Subject Group
  id: subjectgroup_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false
- name: Process Relocations
  id: relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.subjectgroup_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status
- name: Relocations To Trajectory
  id: to_trajectory
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.relocations.return }}
    trajectory_segment_filter:
      min_length_meters: 0.001
      max_length_meters: 100000
      min_time_secs: 1
      max_time_secs: 172800
      min_speed_kmhr: 0.01
      max_speed_kmhr: 500
- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.to_trajectory.return }}
    rename_columns:
      nsd: NSD (km²)
      segment_start: Time
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix
- name: Persist Trajectories
  id: persist_trajectories
  task: ecoscope.platform.tasks.io.persist_df_wrapper
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.to_trajectory.return }}
    filetypes:
    - geoparquet
    sanitize: true
    filename_prefix: trajectories
- name: Persist Relocations
  id: persist_relocations
  task: ecoscope.platform.tasks.io.persist_df_wrapper
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.to_trajectory.return }}
    filetypes:
    - geoparquet
    filename_prefix: relocations
    sanitize: true
- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.columns.return }}
    groupers: ${{ workflow.groupers.return }}
- name: Draw Ecoplot
  id: ecoplot
  task: draw_ecoplot
  partial:
    ecoplot_configs:
    - x_col: Time
      y_col: NSD (km²)
      color_col: null
      plot_style:
        mode: lines
        line:
          color: '#2E6F95'
          width: 1.5
        name: null
        xperiodalignment: null
        marker_colors: null
        textinfo: null
        textposition: null
        texttemplate: null
        fillcolor: null
        width: null
        xperiod: null
      color_column: null
    group_by: extra__name
    tickformat: '%b-%Y'
  mapvalues:
    argnames:
    - dataframe
    argvalues: ${{ workflow.groups.return }}
- name: Persist Text
  id: text
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.ecoplot.return }}
- name: nsd_plot_widget
  id: plot_widget_single_view
  task: create_plot_widget_single_view
  partial:
    title: NSD Plot
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.text.return }}
- name: Merge Widget Views
  id: widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.plot_widget_single_view.return }}
- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets:
    - ${{ workflow.widget_views.return }}
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
