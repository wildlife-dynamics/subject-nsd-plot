id: subject_nsd_plot
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.4
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

rjsf-overrides:
  properties:
    # Turn the free-text subject group field into a drop-down of the chosen
    # EarthRanger site's subject group names.
    subjectgroup_observations.properties.subject_group_name:
      title: Subject Group Name
      type: string
      description: >-
        The EarthRanger subject group to plot NSD for, picked from the chosen data source's
        subject groups. ⚠️ The use of a group with mixed subtypes could lead to unexpected results.
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_connection.properties.data_source.properties.name

    # Group by subject name and/or a time period; leave the list empty for a single "All" view.
    groupers.properties.groupers.title: Group by
    groupers.properties.groupers.description: >-
      Split the dashboard into one view per subject and/or per time period (e.g. month or year).
      Remove every entry to show all the data in a single view.
    groupers.properties.groupers.default:
    - index_name: extra__name
    groupers.properties.groupers.items.anyOf:
    - type: object
      title: Category
      properties:
        index_name:
          title: Category
          type: string
          oneOf:
          - const: extra__name
            title: Subject Name
          default: extra__name
      required:
      - index_name
    - $ref: '#/$defs/TemporalGrouper'

task-instance-defaults:
  skipif:
    conditions:
    - never

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Group Data
  id: groupers
  task: set_groupers

- name: Subject Group
  id: subjectgroup_observations
  task: get_subjectgroup_observations
  partial:
    client: ${{ workflow.er_connection.return }}
    time_range: ${{ workflow.time_range.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false

- name: Process Relocations
  id: relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.subjectgroup_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - extra__subject_id
    - extra__id
    - extra__location
    - extra__created_at
    - extra__recorded_at
    - extra__source
    - extra__exclusion_flags
    - extra__subject__updated_at
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__subject__subject_subtype
    - geometry
    - groupby_col
    - fixtime
    - junk_status

- name: Relocations To Trajectory
  id: to_trajectory
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.relocations.return }}

# Index by any chosen time grouper before segment_start is renamed.
- name: Add Temporal Index
  id: traj_temporal_index
  task: add_temporal_index
  partial:
    df: ${{ workflow.to_trajectory.return }}
    time_col: segment_start
    groupers: ${{ workflow.groupers.return }}
    cast_to_datetime: true
    format: mixed

- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.traj_temporal_index.return }}
    rename_columns:
      nsd: NSD (km²)
      segment_start: Time
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Persist Trajectories
  id: persist_trajectories
  task: ecoscope.platform.tasks.io.persist_df_wrapper
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.to_trajectory.return }}
    filetypes:
    - geoparquet
    sanitize: true
    filename_prefix: trajectories

- name: Persist Relocations
  id: persist_relocations
  task: ecoscope.platform.tasks.io.persist_df_wrapper
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.to_trajectory.return }}
    filetypes:
    - geoparquet
    filename_prefix: relocations
    sanitize: true

- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.columns.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Draw Ecoplot
  id: ecoplot
  task: draw_ecoplot
  partial:
    ecoplot_configs:
    - x_col: Time
      y_col: NSD (km²)
      color_col: null
      plot_style:
        mode: lines
        line:
          color: '#2E6F95'
          width: 1.25
        name: null
        xperiodalignment: null
        marker_colors: null
        textinfo: null
        textposition: null
        texttemplate: null
        fillcolor: null
        width: null
        xperiod: null
      color_column: null
    group_by: extra__name
    tickformat: '%b-%Y'
  mapvalues:
    argnames:
    - dataframe
    argvalues: ${{ workflow.groups.return }}

- name: Persist Text
  id: text
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.ecoplot.return }}

- name: nsd_plot_widget
  id: plot_widget_single_view
  task: create_plot_widget_single_view
  partial:
    title: NSD Plot
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.text.return }}

- name: Merge Widget Views
  id: widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.plot_widget_single_view.return }}
    
- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets:
    - ${{ workflow.widget_views.return }}
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
